version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: logistique_mongo
    environment:
      MONGO_INITDB_DATABASE: logistique_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - logistique-network

  app:
    build: .
    container_name: logistique_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/logistique_db
      JWT_SECRET: "mySuperSecretKeyForJWTGenerationInLogistiqueSystem2024SecureWith256Bits"
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - mongodb
    networks:
      - logistique-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:

networks:
  logistique-network:
    driver: bridge